
<div class="center">
  <div class="navigation">

    <input type="checkbox" name="" id="close" />
    <div class="icons">
      <div class="lang-menu-wrapper icon"  (click)="$event.stopPropagation()">
        <button class="lang-toggle-btn" (click)="toggleLangMenu()">
          <span class="material-icons">language</span>
        </button>

        <div class="lang-menu"
             [class.open]="langMenuOpen"
             (clickOutside)="langMenuOpen = false">
          <div class="lang-option" (click)="changeLang('ru')">Русский</div>
          <div class="lang-option" (click)="changeLang('en')">English</div>
          <div class="lang-option" (click)="changeLang('ro')">Română</div>
        </div>
      </div>

      <input type="radio" name="nav" id="n1" checked />
      <label for="n1" class="icon">
        <a [href]="'/' + currentLang" (click)="onNavClick($event, '')" class="material-icons-outlined"> home </a>
      </label>

      <input type="radio" name="nav" id="n2" />
      <label for="n2" class="icon">
        <a [href]="'/' + currentLang + '#activity'" (click)="onNavClick($event, 'activity')" class="material-icons-outlined">info</a>
      </label>

      <input type="radio" name="nav" id="n3" />
      <label for="n3" class="icon">
        <a [href]="'/' + currentLang + '#ai'" (click)="onNavClick($event, 'ai')" class="material-icons-outlined">smart_toy</a>
      </label>

      <input type="radio" name="nav" id="n4" />
      <label for="n4" class="icon">
        <a [href]="'/' + currentLang + '#pricing'" (click)="onNavClick($event, 'pricing')" class="material-icons-outlined">payments</a>
      </label>

      <input type="radio" name="nav" id="n7" />
      <label for="n7" class="icon">
        <a [href]="'/' + currentLang + '#contact-us'" (click)="onNavClick($event, 'contact-us')" class="material-icons-outlined">call</a>
      </label>
      <label for="close" class="close-btn"></label>
    </div>
  </div>
</div>
