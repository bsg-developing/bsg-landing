<div class="services-wrapper" id="main">
  <background-wrapper class="services-bg" [@fadeIn]/>
  <div class="services">
    <div class="titleContainer">
      <h1>
        <span class="line"><b class="hover">{{ 'unique' | transloco }}</b> {{ 'ideas' | transloco }}</span>
        <span class="line"><b class="hover">{{ 'for' | transloco }}</b> {{ 'business' | transloco }}</span>
      </h1>
      <p class="hero-subtitle">{{ 'heroSubtitle' | transloco }}</p>
    </div>
    <ide/>
    <section class="stats">
      @for (stat of stats; let i = $index; track stat) {
        <div class="stat">
          <h2
            [@countUp]="{ value: stat.end, params: { duration: duration, easing: 'ease-out' } }"
            (@countUp.start)="onCountStart($any($event), stat.end, i)">
            {{ values[i] }}+
          </h2>
          <span>{{ getLabel(stat) }}</span>
        </div>
      }
    </section>
    <about-us id="activity"/>
    <app-ai-block id="ai"/>
    <activity id="Approach" />
    <slider id="technologies"/>
    <app-project-timeline id="features"/>
    <app-pricing-block id="pricing"/>
    <trusted-companies id ="trust"/>
    <app-contact-form id ="contact-us"/>
  </div>
</div>
<app-menu/>
